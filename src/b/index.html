<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wdth,wght@0,5..1200,87.5..112.5,300..900;1,5..1200,87.5..112.5,300..900&family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..500&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400&display=swap">

</head>
<body>

<template data-khatam>{{khatam:640}}</template>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs><clipPath id="arch-clip" clipPathUnits="objectBoundingBox"><path d="{{arch}}"/></clipPath></defs>
</svg>


<div class="bar" data-progress-bar aria-hidden="true"></div>


  <!-- Drawn by the reader: stroke length tied to scroll depth. -->
  

<!-- ============================================================== HEADER === -->
<header class="top">
  <a class="top__mark" href="#top" data-header-mark>Syed Saddiq &amp; Bella</a>
  <nav class="top__nav" data-nav aria-label="Halaman">
    <a href="#invite" data-i18n="nav.invite"></a>
    <a href="#story"    data-i18n="nav.story"></a>
    <a href="#majlis"   data-i18n="nav.events"></a>
    <a href="#atur"     data-i18n="nav.schedule"></a>
    <a href="#panduan"  data-i18n="nav.travel"></a>
    <a href="#ucapan"   data-i18n="nav.wishes"></a>
  </nav>
  <div class="top__end">
    <div class="lang" role="group" aria-label="Bahasa / Language">
      <button type="button" data-lang-btn="ms">BM</button><span>/</span><button type="button" data-lang-btn="en">EN</button>
    </div>
    <a class="btn btn--quiet" href="#rsvp" data-i18n="nav.rsvp"></a>
  </div>
</header>

<main id="main" tabindex="-1">

  <!-- ============================================================= HERO === -->
  <section class="hero" id="top">
    <div class="lightwrap" aria-hidden="true"><canvas data-light></canvas></div>
    <div class="spot" data-spot aria-hidden="true"></div>
    <!-- Gunung Kinabalu. He asked at the top, at 4,095 m, in heavy rain. -->
    <canvas class="petals" data-petals aria-hidden="true"></canvas>
    <div class="hero__in">
      <p class="hero__ar ar-kufi" lang="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <p class="hero__eyebrow eyebrow"><span data-i18n="hero.eyebrow"></span></p>

      <h1 class="hero__names" data-hero-names>
        <span class="hero__line foil" data-split style="--d:250ms">Syed Saddiq</span>
        <span class="hero__amp">&amp;</span>
        <span class="hero__line foil" data-split style="--d:520ms">Bella Astillah</span>
      </h1>

      <div class="hero__rule" aria-hidden="true"></div>
      <p class="hero__meta">
        <span data-i18n="hero.day"></span>
        <span><b>10 . 10 . 2026</b></span>
        <span>29 Rabiulakhir 1448H</span>
        <span data-i18n="hero.place"></span>
      </p>
    </div>
    <div class="hero__cue" aria-hidden="true"><i></i><span data-i18n="hero.scroll"></span></div>
  </section>


  <!-- ======================================================== INVITATION === -->
  <section class="bay invite" id="invite">
    <div class="invite__kh" aria-hidden="true">{{khatam:640}}</div>
    <div class="shell">
      <div class="head" data-rise>
        <p class="eyebrow" data-i18n="hostsBlock.title"></p>
        <h2 class="head__title" data-i18n="invite.title"></h2>
        <p class="head__lead lead invite__lead" data-i18n="hostsBlock.lead"></p>
      </div>
      <div class="narrow" style="max-width:52rem" data-rise>
        <div class="hosts" data-hosts></div>
        <p class="invite__kids" data-i18n="hostsBlock.withChildren"></p>
      </div>
    </div>
  </section>

  <!-- ============================================================ STORY === -->
  <section class="bay bay--raise" id="story">
    <div class="shell">
      <div class="head" data-rise>
        <p class="eyebrow" data-i18n="nav.story"></p>
        <h2 class="head__title" data-i18n="story.title"></h2>
        <p class="head__lead lead" data-i18n="story.lead"></p>
      </div>
      <div class="beats" data-story-beats></div>
    </div>

    <div class="shell pullbig" data-rise>
      <figure style="margin:0">
        <q class="foil" data-i18n="story.pull.q"></q>
        <cite data-i18n="story.pull.a"></cite>
      </figure>
    </div>

    <div class="shell">
      <div class="beats">
        <div class="beat" data-rise>
          <div class="beat__art">
            <!-- PHOTO SLOT 3 — set --img on .plate__img to a photograph -->
            <div class="plate plate--wide" data-open>
              <div class="plate__img" data-parallax="0.16" style="background-image:var(--img,none)"></div>
              <div class="plate__kh" aria-hidden="true">{{khatam:640}}</div>
              <p class="plate__cap" data-i18n="family.title"></p>
            </div>
          </div>
          <div class="beat__body">
            <div class="beat__kick"><em data-i18n="family.title"></em></div>
            <h3 class="beat__title" data-i18n="family.headline"></h3>
            <p class="beat__text" data-i18n="family.body"></p>
            <blockquote class="beat__quote">
              <p data-i18n="family.quote"></p><cite data-i18n="family.by"></cite>
            </blockquote>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- =========================================================== MAJLIS === -->
  <section class="bay" id="majlis">
    <div class="shell">
      <div class="head" data-rise>
        <p class="eyebrow" data-i18n="nav.events"></p>
        <h2 class="head__title" data-i18n="events.title"></h2>
        <p class="head__lead lead" data-i18n="events.lead"></p>
      </div>
      <div class="cards" data-events data-rise></div>
    </div>
  </section>

  <!-- ======================================================== COUNTDOWN === -->
  <section class="bay bay--raise">
    <div class="shell">
      <div class="head" data-rise>
        <p class="eyebrow" data-i18n="countdown.title"></p>
      </div>
      <div class="cd" data-countdown data-rise></div>
      <p class="cd__done" data-countdown-done hidden data-i18n="countdown.done"></p>
    </div>
  </section>

  <!-- ======================================================== ATUR CARA === -->
  <section class="bay" id="atur">
    <div class="shell narrow" style="max-width:44rem">
      <div class="head" data-rise>
        <p class="eyebrow" data-i18n="labels.provisional"></p>
        <h2 class="head__title" data-i18n="scheduleBlock.title"></h2>
        <p class="head__lead lead" data-i18n="scheduleBlock.lead"></p>
      </div>
      <ol data-schedule data-rise></ol>
      <p class="note" data-i18n="scheduleBlock.note"></p>
    </div>
  </section>

  <!-- ========================================================== PANDUAN === -->
  <section class="bay bay--raise" id="panduan">
    <div class="shell">
      <div class="head" data-rise>
        <p class="eyebrow" data-i18n="nav.travel"></p>
        <h2 class="head__title" data-i18n="travel.title"></h2>
        <p class="head__lead lead" data-i18n="travel.lead"></p>
      </div>
      <div class="tips" data-travel data-rise></div>
      <div class="narrow" style="margin-top:clamp(3.5rem,9vw,5.5rem)" data-rise>
        <div class="head" style="margin-bottom:1.5rem"><p class="eyebrow" data-i18n="faq.title"></p></div>
        <div data-faq></div>
      </div>
    </div>
  </section>

  <!-- ============================================================= RSVP === -->
  <section class="bay rsvp" id="rsvp">
    <div class="shell">
      <div class="head" data-rise>
        <p class="eyebrow" data-i18n="nav.rsvp"></p>
        <h2 class="head__title foil" data-i18n="rsvp.title"></h2>
        <p class="head__lead lead" data-i18n="rsvp.lead"></p>
      </div>

      <div class="rsvp__card" data-rise>
        <p class="rsvp__dl" data-i18n="rsvp.deadline"></p>
        <p class="saved" data-rsvp-saved hidden>
          <span data-rsvp-saved-text></span>
          <button type="button" data-rsvp-edit data-i18n="rsvp.savedEdit"></button>
        </p>

        <form id="rsvp-form" novalidate>
          <ol class="prog" data-progress aria-hidden="true"></ol>
          <p class="sr" data-step-live role="status" aria-live="polite"></p>

          <fieldset class="step" data-step="who">
            <legend class="step__q" data-i18n="rsvp.qWho"></legend>
            <div class="field">
              <label class="field__label" for="f-name" data-i18n="rsvp.name"></label>
              <input id="f-name" name="name" type="text" required autocomplete="name" data-i18n="rsvp.namePh" data-i18n-attr="placeholder">
              <p class="field__error" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-phone" data-i18n="rsvp.phone"></label>
              <input id="f-phone" name="phone" type="tel" inputmode="tel" required autocomplete="tel" data-validate="phone" data-i18n="rsvp.phonePh" data-i18n-attr="placeholder">
              <p class="field__error" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-email" data-i18n="rsvp.email"></label>
              <input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" data-i18n="rsvp.emailPh" data-i18n-attr="placeholder">
              <p class="field__error" hidden></p>
            </div>
            <div class="acts"><button class="btn" type="button" data-next data-i18n="rsvp.next"></button></div>
          </fieldset>

          <fieldset class="step" data-step="attend" hidden>
            <legend class="step__q" data-i18n="rsvp.attending"></legend>
            <div class="choices">
              <label class="choice"><input type="radio" name="attending" value="yes"><span class="choice__box" aria-hidden="true"></span>
                <span class="choice__text"><span class="choice__title" data-i18n="rsvp.yes"></span></span></label>
              <label class="choice"><input type="radio" name="attending" value="no"><span class="choice__box" aria-hidden="true"></span>
                <span class="choice__text"><span class="choice__title" data-i18n="rsvp.no"></span></span></label>
            </div>
            <p class="group__error" data-error-for="attending" hidden></p>
            <div>
              <p class="field__label" style="margin-bottom:.7rem" data-i18n="rsvp.whichEvents"></p>
              <p class="step__hint" style="margin:0 0 1rem" data-i18n="rsvp.whichHint"></p>
              <div class="choices" data-rsvp-events></div>
              <p class="group__error" data-error-for="events" hidden></p>
            </div>
            <div class="acts">
              <button class="btn btn--back" type="button" data-prev data-i18n="rsvp.prev"></button>
              <button class="btn" type="button" data-next data-i18n="rsvp.next"></button>
            </div>
          </fieldset>

          <fieldset class="step" data-step="detail" hidden>
            <legend class="step__q" data-i18n="rsvp.pax"></legend>
            <p class="step__hint" data-i18n="rsvp.paxHint"></p>
            <div class="pax">
              <div class="counter"><span id="lab-adults" data-i18n="rsvp.adults"></span>
                <div><button type="button" data-stepper="adults" data-delta="-1" aria-label="−">&minus;</button>
                  <input type="number" name="adults" value="1" min="0" max="20" aria-labelledby="lab-adults">
                  <button type="button" data-stepper="adults" data-delta="1" aria-label="+">+</button></div></div>
              <div class="counter"><span id="lab-children" data-i18n="rsvp.children"></span>
                <div><button type="button" data-stepper="children" data-delta="-1" aria-label="−">&minus;</button>
                  <input type="number" name="children" value="0" min="0" max="20" aria-labelledby="lab-children">
                  <button type="button" data-stepper="children" data-delta="1" aria-label="+">+</button></div></div>
            </div>
            <p class="group__error" data-error-for="pax" hidden></p>
            <div class="field">
              <label class="field__label" for="f-diet" data-i18n="rsvp.dietary"></label>
              <input id="f-diet" name="dietary" type="text" data-i18n="rsvp.dietaryPh" data-i18n-attr="placeholder">
            </div>
            <div class="field">
              <label class="field__label" for="f-msg" data-i18n="rsvp.message"></label>
              <textarea id="f-msg" name="message" rows="3" data-i18n="rsvp.messagePh" data-i18n-attr="placeholder"></textarea>
            </div>
            <label class="choice"><input type="checkbox" name="shareWish" value="yes" checked><span class="choice__box" aria-hidden="true"></span>
              <span class="choice__text"><span class="choice__title" data-i18n="rsvp.shareWish"></span></span></label>
            <div class="acts">
              <button class="btn btn--back" type="button" data-prev data-i18n="rsvp.prev"></button>
              <button class="btn" type="button" data-next data-i18n="rsvp.next"></button>
            </div>
          </fieldset>

          <fieldset class="step" data-step="review" hidden>
            <legend class="step__q" data-i18n="rsvp.reviewTitle"></legend>
            <dl class="review" data-review></dl>
            <div class="acts">
              <button class="btn btn--back" type="button" data-prev data-i18n="rsvp.prev"></button>
              <button class="btn btn--gold" type="submit" data-i18n="rsvp.submit"></button>
            </div>
          </fieldset>
        </form>

        <div id="rsvp-success" class="success" hidden>
          <div class="success__kh" aria-hidden="true">{{khatam:640}}</div>
          <h3 class="success__title" data-success-title></h3>
          <p class="success__body" data-success-body></p>
          <div class="success__dua" data-sacred="dua"></div>
          <div class="success__acts">
            <button class="btn btn--quiet" type="button" data-ics="akad" data-i18n="labels.addToCalendar"></button>
            <button class="btn btn--quiet" type="button" data-rsvp-edit data-i18n="rsvp.success.again"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- =========================================================== UCAPAN === -->
  <section class="bay bay--raise" id="ucapan">
    <div class="shell">
      <div class="head" data-rise>
        <p class="eyebrow" data-i18n="nav.wishes"></p>
        <h2 class="head__title" data-i18n="wishes.title"></h2>
        <p class="head__lead lead" data-i18n="wishes.lead"></p>
      </div>
      <form class="wish-form" id="wish-form" data-rise>
        <div class="field">
          <label class="field__label" for="w-name" data-i18n="wishes.name"></label>
          <input id="w-name" name="wname" type="text" required autocomplete="name">
        </div>
        <div class="field">
          <label class="field__label" for="w-text" data-i18n="wishes.wish"></label>
          <textarea id="w-text" name="wish" rows="3" required></textarea>
        </div>
        <div class="acts"><button class="btn" type="submit" data-i18n="wishes.submit"></button></div>
      </form>
      <ul class="wishes" data-wishes></ul>
    </div>
  </section>

  <!-- ========================================================= BLESSING === -->
  <section class="bay">
    <div class="shell narrow" style="max-width:48rem">
      <div class="blessing" data-rise>
        <p class="eyebrow" data-i18n="gift.title"></p>
        <p class="lead" style="max-width:36ch" data-i18n="gift.body"></p>
      </div>
      <div class="blessing" style="margin-top:clamp(3.5rem,9vw,5.5rem)" data-sacred="verse" data-sacred-tr data-rise></div>
    </div>
  </section>
</main>

<!-- ============================================================== FOOTER === -->
<footer class="foot">
  <div class="foot__kh" aria-hidden="true">{{khatam:640}}</div>
  <div class="shell">
    <p class="foot__thanks" data-i18n="footer.thanks"></p>
    <p class="foot__names foil">Syed Saddiq &amp; Bella Astillah</p>
    <p class="foot__hash">#BellaSyedYes</p>
    <div class="foot__acts">
      <!-- Replace with the family's WhatsApp contact before launch. -->
      <a class="btn btn--quiet" href="https://wa.me/60000000000" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn btn--quiet" href="#top" data-i18n="labels.backToTop"></a>
    </div>
    <p class="foot__credit" data-i18n="footer.credit"></p>
  </div>
</footer>

<div data-grain aria-hidden="true"></div>

<script>
window.CONFIG = {
  design:'malam', countdownTo:'2026-10-10T10:00:00+08:00',
  endpoint:'',   /* paste your Apps Script Web App URL here to go live */
  audio:'', audioOnOpen:false
};
/* Paper does not glow. The lightfield here is a whisper of warmth in the
   stock itself — a tenth of design A's strength, cool-shifted, no filaments. */

window.LIGHT_OPTS = { warm:'rgba(232,225,211,0.30)', cool:'rgba(196,186,168,0.20)', fade:'rgba(241,236,222,0)', filamentAlpha:0 };
window.GRAIN_ALPHA = 30;
</script>
<script>{{inline:src/content.js}}</script>
<script>{{inline:src/app.js}}</script>
<script>{{inline:src/fx.js}}</script>
</body>
</html>
