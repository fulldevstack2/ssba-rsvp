    radial-gradient(60% 52% at 78% 78%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 76%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg-2) 62%,var(--bg-3) 100%);
  opacity:0;transform:scale(1.06);
  transition:opacity 1.6s var(--ez),transform 2.4s var(--ez)}
.leaf.played .leaf__room{opacity:1;transform:none}

/* the sheet itself: a real leaf of paper, lifted off the ground */
/* 92vw measured the viewport, scrollbar included, so the sheet was a few
   pixels wider than the space it sits in and read as off-centre. */
.leaf__sheet{position:relative;z-index:1;width:min(40rem,100%);
  padding:clamp(3.2rem,7vw,5rem) clamp(1.9rem,5vw,3.4rem) clamp(3.4rem,7.5vw,5.4rem);
  background:linear-gradient(168deg,#FFFDF9,var(--surface) 58%,#F6F1E6);
  border:1px solid color-mix(in srgb,var(--accent) 16%,transparent);
  box-shadow:0 2px 0 rgba(255,255,255,.7) inset,
             0 40px 90px -30px rgba(60,45,22,.22),
             0 10px 26px -14px rgba(60,45,22,.14);
  overflow:hidden;text-align:center;
  opacity:0;filter:blur(16px);transform:translateY(2.2rem) scale(.975);
  transition:opacity 1.3s var(--ez) .25s,filter 1.5s var(--ez) .25s,transform 1.6s var(--ez) .25s}
.leaf.played .leaf__sheet{opacity:1;filter:blur(0);transform:none}

/* light raking across the sheet, always — paper is never evenly lit */
.leaf__rake{position:absolute;inset:-30% -60%;z-index:0;pointer-events:none;
  background:linear-gradient(104deg,transparent 38%,
    color-mix(in srgb,#FFF8E6 70%,transparent) 50%,transparent 62%);
  animation:rake 13s ease-in-out infinite alternate}
@keyframes rake{from{transform:translate3d(-16%,0,0)}to{transform:translate3d(16%,0,0)}}

.leaf__ar{position:relative;font-family:var(--arabic);direction:rtl;
  font-size:clamp(1.5rem,5vw,2.5rem);line-height:2.1;color:var(--gilt);
  opacity:0;transform:translateY(.7rem);
  transition:opacity 1.1s var(--ez) 1.05s,transform 1.2s var(--ez) 1.05s}
.leaf.played .leaf__ar{opacity:1;transform:none}

.leaf__rule{position:relative;display:block;width:3.4rem;height:1px;margin:clamp(1.6rem,4vw,2.4rem) auto;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  transform:scaleX(0);transition:transform 1s var(--ez) 1.6s}
.leaf.played .leaf__rule{transform:scaleX(1)}

/* the invitation is read down the page rather than faded in */
.leaf__lede{position:relative;font-family:var(--body);font-style:italic;
  font-size:clamp(1.06rem,2.8vw,1.32rem);line-height:1.9;color:var(--ink-2);
  max-width:32ch;margin-inline:auto;
  clip-path:inset(0 0 100% 0)}
/* paced to the rose: the words are still arriving while the stem is drawn */
.leaf.played .leaf__lede{animation:readDown 5.6s cubic-bezier(.3,.5,.3,1) 1.6s both}
@keyframes readDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -6% 0)}}

/* the beam that does the reading, travelling with it and then gone */
.leaf__beam{position:absolute;left:0;right:0;height:38%;z-index:2;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,#FFF6DF 85%,transparent) 62%,transparent);
  mix-blend-mode:screen}
.leaf.played .leaf__beam{animation:beam 5.9s cubic-bezier(.3,.5,.3,1) 1.55s both}
@keyframes beam{
  0%{opacity:0;transform:translateY(38%)}
  18%{opacity:1}
  82%{opacity:1}
  100%{opacity:0;transform:translateY(210%)}}

@media (prefers-reduced-motion:reduce){
  .leaf__room,.leaf__sheet,.leaf__ar{opacity:1;filter:none;transform:none;transition:none}
  .leaf__rule{transform:scaleX(1)}
  .leaf__lede{clip-path:none;animation:none}
  .leaf__rake,.leaf__beam{display:none}
}

/* The particle canvases. Named .particles, never .field — the reply form owns
   .field, and the collision made every input absolutely positioned and
   click-through. */
.particles{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.leaf .particles{z-index:0}
.leaf__sheet{z-index:2}
@media (prefers-reduced-motion:reduce){.particles{display:none}}

/* ------------------------------------------------- the rose on the sheet --- */
/* A single stem drawn into the lower corner of the paper while the invitation
   is being read. It sits under the type, never over it, and is faint enough to
   be a watermark rather than an illustration. */
/* the stem runs past the foot of the card and is clipped there, so it reads
   as continuing rather than stopping */
/* The stroke itself is solid and the whole drawing is faded as one layer.
   A translucent stroke composites twice wherever two lines cross, and those
   darker knots were the first thing the eye found. */
.leaf__bloom{position:absolute;z-index:0;pointer-events:none;
  right:clamp(-1.6rem,-2vw,-.6rem);bottom:-64px;
  width:clamp(11rem,26vw,17rem);color:var(--accent);opacity:.42;
  isolation:isolate}
.leaf__bloom .bloomline{width:100%;height:auto;overflow:visible;display:block}
.leaf__bloom .bloomline path{fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
/* before the trace runs the drawing is simply absent, not half-drawn */
.leaf__bloom.trace-armed .bloomline{opacity:1}
.leaf__sheet>*:not(.leaf__bloom):not(.leaf__rake){position:relative;z-index:1}

@media (max-width:46rem){
  /* smaller drawing, same 1.6px stroke would crowd the dense passages into
     blots, so the line thins with it */
  .leaf__bloom{width:clamp(8rem,34vw,11rem);right:.4rem;bottom:-44px;opacity:.34}
  .leaf__bloom .bloomline path{stroke-width:1.1}
}
@media (prefers-reduced-motion:reduce){
  .leaf__bloom .bloomline path{stroke-dashoffset:0!important}
}

/* =============================================================================
   SECTION REVEALS
   -----------------------------------------------------------------------------
   Arriving at a section should be an event in itself, not just its contents
   fading up. Each one gets a different gesture. Two of these clip, so they are
   only used where nothing inside is sticky — clip-path creates a containing
   block and would break a sticky column.
   ============================================================================= */
@keyframes rvWipe  {from{clip-path:inset(0 0 100% 0)} to{clip-path:inset(0 0 0 0)}}
@keyframes rvIris  {from{clip-path:circle(0% at 50% 50%)} to{clip-path:circle(85% at 50% 50%)}}
@keyframes rvUnfurl{from{transform:scaleY(.92);filter:blur(10px);opacity:0}
                    to  {transform:none;filter:blur(0);opacity:1}}
@keyframes rvDrift {from{transform:scale(1.035) translateY(1.4rem);filter:blur(12px);opacity:0}
                    to  {transform:none;filter:blur(0);opacity:1}}

/* the light sweeps across a section as it opens */
.rv::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
  background:linear-gradient(104deg,transparent 34%,
    color-mix(in srgb,#FFF6DF 78%,transparent) 50%,transparent 66%);
  mix-blend-mode:screen}
.rv.played::after{animation:sweepLight 1.5s var(--ez) .1s both}
@keyframes sweepLight{
  0%{opacity:0;transform:translate3d(-42%,0,0)}
  22%{opacity:.9} 78%{opacity:.9}
  100%{opacity:0;transform:translate3d(42%,0,0)}}

/* Each reveal scales or slides its whole section; without this the few pixels
   that puts outside the page during the animation became real page width. */
.rv{overflow-x:clip}
.rv-wipe{clip-path:inset(0 0 100% 0)}
.rv-wipe.played{animation:rvWipe 1.25s var(--ez) both}
.rv-iris{clip-path:circle(0% at 50% 50%)}
.rv-iris.played{animation:rvIris 1.5s var(--ez) both}
.rv-unfurl{transform-origin:top center;opacity:0}
.rv-unfurl.played{animation:rvUnfurl 1.2s var(--ez) both}
.rv-drift{opacity:0}
.rv-drift.played{animation:rvDrift 1.25s var(--ez) both}

@media (prefers-reduced-motion:reduce){
  .rv-wipe,.rv-iris,.rv-unfurl,.rv-drift{clip-path:none!important;opacity:1!important;
    transform:none!important;filter:none!important;animation:none!important}
  .rv::after{display:none}
}

/* =============================================================================
   THE COLOPHON
   -----------------------------------------------------------------------------
   Light, like the rest of the page. A hairline opens it, the names sit in gold
   at the centre of a wide measure, and the practical links sit quietly beneath
   a second rule. Nothing here is dark.
   ============================================================================= */

<script>/* =============================================================================
   SSBA — shared behaviour for both designs.
   Requires window.CONTENT (content.js) and window.CONFIG (set per page).
   Everything degrades gracefully: with no backend it runs in demo mode, and
   with JavaScript disabled the page is still a readable invitation.
   ============================================================================= */
(function () {
  'use strict';

  var $  = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var CFG = window.CONFIG || {};
  var C   = window.CONTENT || {};
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------------------------------------------------------------- language */
  var LANGS = ['ms', 'en'];
  var qs = new URLSearchParams(location.search);
  var lang = qs.get('lang') || store.get('ssba.lang') || (/^ms|^id/i.test(navigator.language || '') ? 'ms' : 'ms');
  if (LANGS.indexOf(lang) < 0) lang = 'ms';

  function t(key) {
    function dig(root) {
      return String(key).split('.').reduce(function (o, k) { return (o == null ? undefined : o[k]); }, root);
    }
    var v = dig(C[lang]);
    if (v === undefined) v = dig(C.en);
    return v === undefined ? '' : v;
  }
  function pick(obj) { // {ms,en} → string for current language
    if (obj == null) return '';
    if (typeof obj === 'string') return obj;
    return obj[lang] != null ? obj[lang] : (obj.en != null ? obj.en : '');
  }

  function setLang(l) {
    if (LANGS.indexOf(l) < 0) return;
    lang = l; store.set('ssba.lang', l); apply();
  }

  function apply() {
    document.documentElement.setAttribute('lang', lang);
    $$('[data-i18n]').forEach(function (el) {
      var v = t(el.getAttribute('data-i18n'));
      if (v === '' || typeof v === 'object') return;
      var attr = el.getAttribute('data-i18n-attr');
      if (attr) el.setAttribute(attr, v);
      else if (el.hasAttribute('data-i18n-html')) el.innerHTML = v;
      else el.textContent = v;
    });
    $$('[data-lang-btn]').forEach(function (b) {
      var on = b.getAttribute('data-lang-btn') === lang;
      b.setAttribute('aria-pressed', String(on));
      b.classList.toggle('is-on', on);
    });
    var mt = t('meta.title'); if (mt) document.title = mt;
    var md = $('meta[name="description"]'); if (md) md.setAttribute('content', t('meta.desc'));

    renderSacred(); renderHosts(); renderStory(); renderEvents(); renderSchedule();
    renderTravel(); renderFaq(); renderRsvpEvents(); renderWishes(); tickCountdown();
    document.dispatchEvent(new CustomEvent('ssba:lang', { detail: { lang: lang } }));
  }

  /* ------------------------------------------------------------ sacred texts */
  function renderSacred() {
    var s = C.sacred || {};
    $$('[data-sacred]').forEach(function (host) {
      var which = host.getAttribute('data-sacred');
      var d = s[which]; if (!d) return;
      var parts = [];
      if (d.ar) parts.push('<p class="sacred__ar" dir="rtl" lang="ar">' + esc(d.ar) + '</p>');
      if (host.hasAttribute('data-sacred-tr') && d.tr) parts.push('<p class="sacred__tr">' + esc(d.tr) + '</p>');
      if (!host.hasAttribute('data-sacred-ar-only')) {
        var meaning = pick({ ms: d.ms, en: d.en });
        if (meaning) parts.push('<p class="sacred__meaning">' + esc(meaning) + '</p>');
      }
      var ref = d.ref ? pick(d.ref) : (d.src ? pick(d.src) : '');
      if (ref && !host.hasAttribute('data-sacred-noref')) parts.push('<p class="sacred__ref">' + esc(ref) + '</p>');
      host.innerHTML = parts.join('');
    });
  }

  /* -------------------------------------------------------------------- hosts */
  function renderHosts() {
    var host = $('[data-hosts]'); if (!host) return;
    var H = C.hosts || {}, side = function (names) { return names.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join(''); };
    host.innerHTML =
      '<div class="hosts__side">' +
        '<p class="hosts__label">' + esc(t('hostsBlock.groomSide')) + '</p>' +
        '<ul class="hosts__names">' + side(H.groom || []) + '</ul>' +
      '</div>' +
      '<span class="hosts__div" aria-hidden="true"></span>' +
      '<div class="hosts__side">' +
        '<p class="hosts__label">' + esc(t('hostsBlock.brideSide')) + '</p>' +
        '<ul class="hosts__names">' + side(H.bride || []) + '</ul>' +
      '</div>';
  }

  /* -------------------------------------------------------------------- story */
  var _kh = null;
  function khatamMarkup() {
    if (_kh === null) { var tpl = $('template[data-khatam]'); _kh = tpl ? tpl.innerHTML : ''; }
    return _kh;
  }

  function renderStory() {
    var host = $('[data-story-beats]'); if (!host) return;
    var beats = t('story.beats') || [];
    host.innerHTML = beats.map(function (b, i) {
      return '<article class="beat" data-seq>' +
        '<div class="beat__art">' +
          // PHOTO SLOT — set --img on .plate__img to a photograph and the
          // constructed geometry behind it simply stops showing through.
          '<div class="plate' + (i % 2 ? ' plate--wide' : '') + '" data-open>' +
            '<div class="plate__img" data-parallax="0.18" style="background-image:var(--img-' + (i + 1) + ',none)"></div>' +
            '<div class="plate__kh" aria-hidden="true">' + khatamMarkup() + '</div>' +
            '<p class="plate__cap">' + esc(b.k) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="beat__body">' +
          '<p class="beat__kick"><em>' + esc(b.k) + '</em><i>' + esc(b.y) + '</i></p>' +
          '<h3 class="beat__title">' + esc(b.t) + '</h3>' +
          '<p class="beat__text">' + esc(b.b) + '</p>' +
          (b.q ? '<blockquote class="beat__quote"><p>' + esc(b.q) + '</p><cite>' + esc(b.qa || '') + '</cite></blockquote>' : '') +
        '</div>' +
      '</article>';
    }).join('');
    if (window.FX) { $$('[data-rise]', host).forEach(function (el) { el.classList.add('in'); }); }
  }

  /* ------------------------------------------------------------------- events */
  function renderEvents() {
    var host = $('[data-events]'); if (!host) return;
    var all = C.events || [];
    host.innerHTML = all.map(function (ev, i) {
      var rows = [[t('labels.date'), esc(pick(ev.dateLong)), '']];
      if (!ev.tbc) {
        rows.push([t('labels.time'), esc(pick(ev.time)), '']);
        rows.push([t('labels.venue'), esc(pick(ev.venue)), ev.address ? esc(ev.address) : '']);
        if (ev.dress) rows.push([t('labels.dress'), esc(pick(ev.dress)), '']);
      }
      var acts = [];
      if (ev.maps) acts.push('<a class="btn btn--quiet" href="' + ev.maps + '" target="_blank" rel="noopener">' + esc(t('labels.googleMaps')) + '</a>');
      if (ev.waze) acts.push('<a class="btn btn--quiet" href="' + ev.waze + '" target="_blank" rel="noopener">' + esc(t('labels.waze')) + '</a>');
      if (ev.start) acts.push('<button class="btn btn--quiet" type="button" data-ics="' + ev.id + '">' + esc(t('labels.addToCalendar')) + '</button>');
      var tag = ev.invitationOnly ? t('labels.invitationOnly') : (ev.tbc ? t('labels.detailsToFollow') : '');

      return '<article class="card' + (ev.kind === 'primary' ? ' card--hero' : '') + (ev.tbc ? ' card--tbc' : '') + '" data-ev="' + ev.id + '" data-seq>' +
        '<header><p class="card__eyebrow">' + esc(pick(ev.eyebrow)) + '</p>' +
        '<h3 class="card__title">' + esc(pick(ev.title)) + '</h3></header>' +
        '<div class="card__body">' +
          (tag ? '<p class="card__tag">' + esc(tag) + '</p>' : '') +
          '<dl class="card__meta">' + rows.map(function (r) {
            return '<div><dt>' + esc(r[0]) + '</dt><dd>' + r[1] + (r[2] ? '<small>' + r[2] + '</small>' : '') + '</dd></div>';
          }).join('') + '</dl>' +
          (ev.note ? '<p class="card__note">' + esc(pick(ev.note)) + '</p>' : '') +
          (acts.length ? '<div class="card__acts">' + acts.join('') + '</div>' : '') +
        '</div>' +
      '</article>';
    }).join('');
    var dots = $('[data-rail-dots]');
    if (dots) dots.innerHTML = all.map(function (_, i) {
      return '<i data-rail-dot class="' + (i === 0 ? 'on' : '') + '"></i>';
    }).join('');
  }

  function renderSchedule() {
    var host = $('[data-schedule]'); if (!host) return;
    host.innerHTML = (C.schedule || []).map(function (x) {
      // no time yet means no time column, rather than a dash standing in for one
      return '<li class="run' + (x.time ? '' : ' run--untimed') + '" data-seq>' +
        (x.time ? '<span class="run__t">' + esc(x.time) + '</span>' : '') +
        '<span class="run__b"><b>' + esc(pick(x.title)) + '</b>' +
        (x.desc ? '<span>' + esc(pick(x.desc)) + '</span>' : '') + '</span></li>';
    }).join('');
  }

  function renderTravel() {
    var host = $('[data-travel]'); if (!host) return;
    host.innerHTML = (t('travel.items') || []).map(function (i) {
      return '<div class="tip" data-seq><h3>' + esc(i.t) + '</h3><p>' + esc(i.b) + '</p></div>';
    }).join('');
  }

  function renderFaq() {
    var host = $('[data-faq]'); if (!host) return;
    host.innerHTML = (t('faq.items') || []).map(function (i) {
      return '<details class="faq" data-seq><summary>' + esc(i.q) + '<span class="mk" aria-hidden="true"></span></summary><div><p>' + esc(i.a) + '</p></div></details>';
    }).join('');
  }

  /* ---------------------------------------------------------------- countdown */
  /* Built once, then only the digits are patched. Re-rendering the markup every
     second was restarting every entrance animation in the section once a
     second, which is what made it flicker. */
  var cdBuilt = false;
  function tickCountdown() {
    var host = $('[data-countdown]'); if (!host) return;
    var target = new Date(CFG.countdownTo || '2026-10-10T10:00:00+08:00').getTime();
    var diff = Math.max(0, target - Date.now());
    var units = [
      [Math.floor(diff / 864e5), 'days'],
      [Math.floor(diff / 36e5) % 24, 'hours'],
      [Math.floor(diff / 6e4) % 60, 'minutes'],
      [Math.floor(diff / 1e3) % 60, 'seconds']
    ];
    if (!cdBuilt || host.children.length !== units.length) {
      host.innerHTML = units.map(function (u) {
        return '<div class="cd__unit" data-seq><span class="cd__num foil"></span>' +
               '<span class="cd__label"></span></div>';
      }).join('');
      cdBuilt = true;
    }
    units.forEach(function (u, i) {
      var unit = host.children[i]; if (!unit) return;
      var num = String(u[0]).padStart(2, '0');
      var numEl = unit.firstChild, labEl = unit.lastChild;
      if (numEl.textContent !== num) numEl.textContent = num;
      var lab = t('countdown.' + u[1]);
      if (labEl.textContent !== lab) labEl.textContent = lab;
    });
    if (diff === 0) { var d = $('[data-countdown-done]'); if (d) d.hidden = false; }
  }
  /* a language change relabels without rebuilding */
  setInterval(tickCountdown, 1000);

  /* ----------------------------------------------------------------- calendar */
  function icsFor(ev) {
    var stamp = function (d) { return new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
    var txt = function (s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\;'); };
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//SSBA//Wedding//EN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
      'UID:' + ev.id + '@ssba-wedding', 'DTSTAMP:' + stamp(Date.now()),
      'DTSTART:' + stamp(ev.start), 'DTEND:' + stamp(ev.end || (new Date(ev.start).getTime() + 3 * 36e5)),
      'SUMMARY:' + txt(t('calendar.summary') + ': ' + pick(ev.title)),
      'LOCATION:' + txt(pick(ev.venue) + (ev.address ? ', ' + ev.address : '')),
      'DESCRIPTION:' + txt(t('calendar.description')), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ics]'); if (!b) return;
    var ev = (C.events || []).filter(function (x) { return x.id === b.getAttribute('data-ics'); })[0];
    if (!ev || !ev.start) return;
    var ics = icsFor(ev);
    try {
      var url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
      var a = document.createElement('a'); a.href = url; a.download = 'ssba-' + ev.id + '.ics';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    } catch (err) {}
    var g = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent(t('calendar.summary') + ': ' + pick(ev.title)) +
      '&dates=' + ics.match(/DTSTART:(\w+)/)[1] + '/' + ics.match(/DTEND:(\w+)/)[1] +
      '&location=' + encodeURIComponent(pick(ev.venue)) +
      '&details=' + encodeURIComponent(t('calendar.description'));
    toast(t('toast.calendar'), { href: g, label: t('labels.googleCalendar') });
  });

  /* -------------------------------------------------------------------- toast */
  var toastTimer;
  function toast(msg, link) {
    var el = $('#toast');
    if (!el) {
      el = document.createElement('div'); el.id = 'toast'; el.className = 'toast';
      el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.innerHTML = esc(msg) + (link ? ' <a href="' + link.href + '" target="_blank" rel="noopener">' + esc(link.label) + '</a>' : '');
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('is-on'); }, link ? 8000 : 3400);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]'); if (!b) return;
    var text = b.getAttribute('data-copy');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function () { toast(t('toast.copied')); })
      .catch(function () { toast(t('toast.copyFail')); });
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang-btn]'); if (b) setLang(b.getAttribute('data-lang-btn'));
  });

  /* -------------------------------------------------------- personalised link */
  var guest = (qs.get('to') || '').trim().slice(0, 80);
  if (guest) {
    $$('[data-guest-name]').forEach(function (el) { el.textContent = guest; });
    $$('[data-guest-wrap]').forEach(function (el) { el.hidden = false; });
  }

  /* The opening sequence lives in fx.js (the preloader). */

  /* -------------------------------------------------------------------- music */
  /* A browser will not let a page make noise before the guest has touched it,
     so the music arms itself and starts on the first gesture. The choice is
     remembered: someone who mutes it stays muted on their next visit. */
  var musicBtn = $('[data-music]');
  if (musicBtn) {
    if (!CFG.audio) { musicBtn.hidden = true; }
    else {
      var KEY = 'ssba:music';
      var remember = function (v) { try { localStorage.setItem(KEY, v); } catch (e) {} };
      var recall = function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } };

      var audio = new Audio(CFG.audio);
      audio.loop = true; audio.volume = 0; audio.preload = 'auto';
      var VOL = 0.32, fade = 0, wanted = recall() !== 'off';

      function ramp(to, ms) {
        cancelAnimationFrame(fade);
        var from = audio.volume, t0 = performance.now();
        (function step(t) {
          var k = Math.min(1, (t - t0) / ms);
          audio.volume = Math.max(0, Math.min(1, from + (to - from) * k));
          if (k < 1) fade = requestAnimationFrame(step);
          else if (to === 0) audio.pause();
        })(t0);
      }
      function setState(on) {
        musicBtn.classList.toggle('is-on', on);
        musicBtn.setAttribute('aria-pressed', String(on));
        musicBtn.setAttribute('aria-label', t(on ? 'labels.musicOn' : 'labels.musicOff') || 'Muzik');
      }
      function play() {
        return audio.play().then(function () { setState(true); ramp(VOL, 1400); })
                           .catch(function () { setState(false); });
      }
      setState(false);

      musicBtn.addEventListener('click', function () {
        wanted = audio.paused;
        remember(wanted ? 'on' : 'off');
        if (wanted) play(); else { setState(false); ramp(0, 500); }
      });

      // the first touch anywhere is the gesture the browser is waiting for
      var armed = function () {
        if (!wanted || !audio.paused) return;
        play();
        ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
          removeEventListener(ev, armed, true);
        });
      };
      ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
        addEventListener(ev, armed, { capture: true, passive: true });
      });
      document.addEventListener('ssba:open', function () { if (CFG.audioOnOpen && wanted) play(); });

      // nothing plays into a tab nobody is looking at
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { if (!audio.paused) { audio.pause(); } }
        else if (wanted && audio.paused) { audio.play().catch(function () {}); }
      });
    }
  }

  /* ------------------------------------------------------------------- reveal */
  function initReveal() {
    var els = $$('[data-reveal]');
    if (reduceMotion || !('IntersectionObserver' in window)) { els.forEach(function (el) { el.classList.add('is-in'); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
    els.forEach(function (el) {
      // Anything already on screen stays visible: never hide content at rest.
      if (el.getBoundingClientRect().top < window.innerHeight * 1.05) { el.classList.add('is-in'); return; }
      el.classList.add('will-reveal'); io.observe(el);
    });
    setTimeout(function () { $$('.will-reveal:not(.is-in)').forEach(function (el) { el.classList.add('is-in'); }); }, 8000);
  }

  /* ---------------------------------------------------------------- active nav */
  function initNav() {
    var links = $$('[data-nav] a[href^="#"]');
    if (!links.length || !('IntersectionObserver' in window)) return;
    var map = {};
    links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var a = map[en.target.id];
        if (a && en.isIntersecting) { links.forEach(function (x) { x.classList.remove('is-active'); }); a.classList.add('is-active'); }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    Object.keys(map).forEach(function (id) { var s = document.getElementById(id); if (s) io.observe(s); });
  }

  /* --------------------------------------------------------------------- RSVP */
  var form = $('#rsvp-form');

  function renderRsvpEvents() {
    var box = $('[data-rsvp-events]'); if (!box) return;
    var chosen = ($$('input[name="events"]:checked', box) || []).map(function (i) { return i.value; });
    box.innerHTML = (C.events || []).filter(function (e) { return e.rsvp !== false; }).map(function (ev) {
      var sub = ev.tbc ? t('labels.detailsToFollow') : pick(ev.dateShort || ev.dateLong);
      return '<label class="choice">' +
        '<input type="checkbox" name="events" value="' + ev.id + '"' + (chosen.indexOf(ev.id) >= 0 ? ' checked' : '') + '>' +
        '<span class="choice__box" aria-hidden="true"></span>' +
        '<span class="choice__text"><span class="choice__title">' + esc(pick(ev.title)) + '</span>' +
        '<span class="choice__sub">' + esc(pick(ev.eyebrow)) + ' · ' + esc(sub) + '</span></span>' +
      '</label>';
    }).join('');
  }

  if (form) {
    // A personalised link (?to=) should also start the guest's reply for them.
    if (guest && form.name && !form.name.value) form.name.value = guest;

    var steps = $$('[data-step]', form);
    var step = 0;
    var progress = $('[data-progress]', form);
    var live = $('[data-step-live]', form);

    function declining() { var r = form.querySelector('input[name="attending"]:checked'); return r && r.value === 'no'; }
    function visible(i) { return !(declining() && steps[i] && steps[i].getAttribute('data-step') === 'detail'); }

    function paint() {
      steps.forEach(function (s, i) { s.hidden = i !== step; });
      if (progress) {
        progress.innerHTML = steps.map(function (s, i) {
          return '<li class="' + (i === step ? 'is-now' : '') + (i < step ? ' is-done' : '') + '">' +
                 '<i aria-hidden="true"></i><b>' + esc(t('rsvp.steps.' + s.getAttribute('data-step'))) + '</b></li>';
        }).join('');
      }
      if (live) live.textContent = String(t('rsvp.stepOf')).replace('{n}', step + 1).replace('{total}', steps.length);
      var card = $('.rsvp__card', form) || form;
      if (step > 0) card.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
    }
    function go(dir) {
      var n = step + dir;
      while (steps[n] && !visible(n)) n += dir;
      step = Math.max(0, Math.min(steps.length - 1, n));
      if (steps[step].getAttribute('data-step') === 'review') buildReview();
      paint();
    }
    function fieldError(el, msg) {
      var field = el.closest('.field') || el.parentElement;
      var box = field ? field.querySelector('.field__error') : null;
      if (box) { box.textContent = msg || ''; box.hidden = !msg; }
      if (el.setAttribute) el.setAttribute('aria-invalid', msg ? 'true' : 'false');
    }
    function groupError(name, msg) {
      var box = form.querySelector('[data-error-for="' + name + '"]');
      if (box) { box.textContent = msg || ''; box.hidden = !msg; }
    }
    function validate() {
      var cur = steps[step], ok = true, firstBad = null;
      $$('input[required], textarea[required]', cur).forEach(function (inp) {
        if (inp.type === 'radio' || inp.type === 'checkbox') return;
        var v = inp.value.trim(), msg = '';
        if (!v) msg = t('rsvp.errors.required');
        else if (inp.getAttribute('data-validate') === 'phone' && !/^[+\d][\d\s\-().]{6,}$/.test(v)) msg = t('rsvp.errors.phone');
        else if (inp.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = t('rsvp.errors.email');
        fieldError(inp, msg);
        if (msg && !firstBad) firstBad = inp;
        if (msg) ok = false;
      });
      // optional email, validated only when filled
      var em = cur.querySelector('input[type="email"]:not([required])');
      if (em && em.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())) {
        fieldError(em, t('rsvp.errors.email')); ok = false; if (!firstBad) firstBad = em;
      } else if (em) fieldError(em, '');

      if (cur.getAttribute('data-step') === 'attend') {
        if (!form.querySelector('input[name="attending"]:checked')) { groupError('attending', t('rsvp.errors.required')); ok = false; }
        else {
          groupError('attending', '');
          if (!declining() && !$$('input[name="events"]:checked', form).length) { groupError('events', t('rsvp.errors.events')); ok = false; }
          else groupError('events', '');
        }
      }
      if (cur.getAttribute('data-step') === 'detail') {
        var total = (+form.adults.value || 0) + (+form.children.value || 0);
        if (total < 1) { groupError('pax', t('rsvp.errors.pax')); ok = false; } else groupError('pax', '');
      }
      if (!ok && firstBad) firstBad.focus({ preventScroll: false });
      return ok;
    }
    function collect() {
      var fd = new FormData(form), d = {};
      fd.forEach(function (v, k) { if (k !== 'events') d[k] = v; });
      d.events = fd.getAll('events');
      if (declining()) { d.adults = 0; d.children = 0; d.events = []; }
      d.lang = lang; d.design = CFG.design || ''; d.page = location.pathname;
      return d;
    }
    function buildReview() {
      var host = $('[data-review]', form); if (!host) return;
      var d = collect();
      var evNames = (C.events || []).filter(function (e) { return d.events.indexOf(e.id) >= 0; })
                                    .map(function (e) { return pick(e.title); }).join(' · ');
      var rows = [
        [t('rsvp.name'), d.name, 'who'],
        [t('rsvp.phone'), d.phone, 'who'],
        [t('rsvp.attending'), d.attending === 'yes' ? t('rsvp.yes') : t('rsvp.no'), 'attend']
      ];
      if (d.attending === 'yes') {
        rows.push([t('rsvp.whichEvents'), evNames, 'attend']);
        rows.push([t('rsvp.pax'), (+d.adults || 0) + ' ' + t('rsvp.adults').toLowerCase() +
                   ((+d.children || 0) ? ', ' + d.children + ' ' + t('rsvp.children').toLowerCase() : ''), 'detail']);
        if (d.dietary) rows.push([t('rsvp.dietary'), d.dietary, 'detail']);
      }
      if (d.message) rows.push([t('rsvp.message'), d.message, 'detail']);
      host.innerHTML = rows.filter(function (r) { return r[1]; }).map(function (r) {
        return '<div class="review__row"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) +
               '<button type="button" class="review__edit" data-goto="' + r[2] + '">' + esc(t('rsvp.edit')) + '</button></dd></div>';
      }).join('');
    }

    form.addEventListener('click', function (e) {
      if (e.target.closest('[data-next]')) { if (validate()) go(1); return; }
      if (e.target.closest('[data-prev]')) { go(-1); return; }
      var jump = e.target.closest('[data-goto]');
      if (jump) {
        var name = jump.getAttribute('data-goto');
        steps.forEach(function (s, i) { if (s.getAttribute('data-step') === name) { step = i; paint(); } });
        return;
      }
      var stepper = e.target.closest('[data-stepper]');
      if (stepper) {
        var inp = form.querySelector('input[name="' + stepper.getAttribute('data-stepper') + '"]');
        var min = +inp.min || 0, max = +inp.max || 20;
        inp.value = Math.max(min, Math.min(max, (+inp.value || 0) + (+stepper.getAttribute('data-delta'))));
        groupError('pax', '');
      }
    });
    form.addEventListener('change', function (e) {
      if (e.target.name === 'attending') {
        form.classList.toggle('is-declining', declining());
        groupError('attending', '');
      }
      if (e.target.name === 'events') groupError('events', '');
    });
    form.addEventListener('input', function (e) {
      if (e.target.getAttribute('aria-invalid') === 'true') fieldError(e.target, '');
    });

    var saved = store.get('ssba.rsvp', null);
    if (saved && saved.name) {
      var note = $('[data-rsvp-saved]');
      if (note) {
        note.hidden = false;
        var slot = $('[data-rsvp-saved-text]', note);
        if (slot) slot.textContent = String(t('rsvp.savedNote')).replace('{name}', saved.name);
      }
    }
    document.addEventListener('click', function (e) {
      if (!e.target.closest('[data-rsvp-edit]')) return;
      var d = store.get('ssba.rsvp', {}) || {};
      Object.keys(d).forEach(function (k) {
        $$('[name="' + k + '"]', form).forEach(function (el) {
          if (el.type === 'radio') el.checked = el.value === d[k];
          else if (el.type === 'checkbox') el.checked = Array.isArray(d[k]) && d[k].indexOf(el.value) >= 0;
          else el.value = d[k];
        });
      });
      form.classList.toggle('is-declining', d.attending === 'no');
      var box = $('#rsvp-success'); if (box) box.hidden = true;
      var note2 = $('[data-rsvp-saved]'); if (note2) note2.hidden = true;
      form.hidden = false; step = 0; paint();
      form.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validate()) return;
      var d = collect();
      var btn = form.querySelector('[type="submit"]');
      btn.disabled = true; btn.classList.add('is-busy');
      var done = function () { btn.disabled = false; btn.classList.remove('is-busy'); };
      var ok = function () {
        store.set('ssba.rsvp', d);
        if (d.message && form.querySelector('input[name="shareWish"]:checked')) {
          addWish({ name: d.name, wish: d.message });
        }
        success(d); done();
      };
      if (!CFG.endpoint) { setTimeout(ok, 700); return; }   // demo mode
      fetch(CFG.endpoint, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(d), redirect: 'follow'
      }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(ok)
        .catch(function (err) { console.warn('RSVP failed', err); toast(t('rsvp.errors.network')); done(); });
    });

    function success(d) {
      var box = $('#rsvp-success'); if (!box) return;
      form.hidden = true; box.hidden = false;
      var yes = d.attending === 'yes';
      var count = (+d.adults || 0) + (+d.children || 0);
      var ttl = $('[data-success-title]', box), body = $('[data-success-body]', box);
      if (ttl) ttl.textContent = yes ? t('rsvp.success.titleYes') : t('rsvp.success.titleNo');
      if (body) body.textContent = (yes ? t('rsvp.success.bodyYes') : t('rsvp.success.bodyNo'))
        .replace('{name}', d.name).replace('{count}', count);
      box.setAttribute('tabindex', '-1');
      box.focus({ preventScroll: true });
      box.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    }

    paint();
  }

  /* ------------------------------------------------------------------- wishes */
  var wishes = store.get('ssba.wishes', []);
  function addWish(w) {
    wishes.unshift({ name: w.name, wish: w.wish, t: Date.now() });
    store.set('ssba.wishes', wishes.slice(0, 60));
    renderWishes();
    if (CFG.endpoint) {
      fetch(CFG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'wish', name: w.name, wish: w.wish }) }).catch(function () {});
    }
  }
  function renderWishes() {
    var host = $('[data-wishes]'); if (!host) return;
    var seeds = (C.seedWishes || []).map(function (w) { return { name: w.name, wish: pick(w.wish), seed: true }; });
    var all = wishes.concat(seeds).slice(0, 12);
    host.innerHTML = all.map(function (w) {
      return '<li class="wish' + (w.seed ? ' wish--seed' : '') + '" data-seq>' +
        '<p class="wish__text">' + esc(w.wish) + '</p>' +
        '<p class="wish__by">' + esc(w.name) + (w.seed ? ' <span class="wish__tag">' + esc(t('wishes.example')) + '</span>' : '') + '</p>' +
      '</li>';
    }).join('');
  }
  var wishForm = $('#wish-form');
  if (wishForm) {
    wishForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var n = wishForm.wname.value.trim(), w = wishForm.wish.value.trim();
      if (!n || !w) { toast(t('rsvp.errors.required')); return; }
      addWish({ name: n, wish: w });
      wishForm.reset();
      toast(t('toast.wish'));
    });
    if (CFG.endpoint) {
      fetch(CFG.endpoint + '?type=wishes').then(function (r) { return r.json(); })
        .then(function (j) { if (j && j.ok && j.wishes && j.wishes.length) { wishes = j.wishes; renderWishes(); } })
        .catch(function () {});
    }
  }

  /* --------------------------------------------------------------------- boot */
  apply();
  initReveal();
  initNav();
  window.SSBA = { t: t, pick: pick, setLang: setLang, toast: toast, get lang() { return lang; } };
})();
</script>
<script>/* =============================================================================
   SSBA — motion and material layer, shared by both designs.
   Everything here is progressive: with JavaScript off, or with
   prefers-reduced-motion, the page is still complete and readable.
   ============================================================================= */
(function () {
  'use strict';
  var $  = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var root = document.documentElement;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  var FX = {};

  /* --------------------------------------------------- "is it really in view" */
  /* One honest test for every reveal on the page. A sliver of a section poking
     over the fold is not being looked at: a real band of it has to be inside
     the viewport — a third of the element's own height, or a third of the
     screen when the element is taller than that. Everything that plays on
     arrival asks this, so nothing can fire ahead of the reader.               */
  function seen(el, share) {
    var r = el.getBoundingClientRect();
    if (r.bottom <= 0 || r.top >= innerHeight) return false;
    // nothing plays while it is still down in the last quarter of the screen
    if (r.top > innerHeight * 0.74) return false;
    var vis = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
    var need = Math.min(r.height * (share || 0.34), innerHeight * 0.34);
    return vis >= Math.max(1, need);
  }

  /* ---------------------------------------------------------- split letters */
  /* Wraps each character so it can rise out of a mask, word by word.          */
  FX.split = function (el) {
    if (el.dataset.splitDone) return;
    var text = el.textContent.trim();
    el.textContent = '';
    var words = text.split(/\s+/), n = 0;
    words.forEach(function (w, wi) {
      var ws = document.createElement('span');
      ws.className = 'sp-w';
      Array.prototype.forEach.call(w, function (ch) {
        var s = document.createElement('span');
        s.className = 'sp-c';
        s.textContent = ch;
        s.style.setProperty('--i', n++);
        ws.appendChild(s);
      });
      el.appendChild(ws);
      if (wi < words.length - 1) el.appendChild(document.createTextNode(' '));
    });
    el.dataset.splitDone = '1';
    el.style.setProperty('--n', n);
  };

  /* ------------------------------------------------------------- film grain */
  /* Real grain has to tile at 1:1 or it smears into blobs, so the noise is
     baked to a few small tiles and cycled as a repeating background.          */
  FX.grain = function (el, opts) {
    if (!el) return;
    opts = opts || {};
    /* One tile, painted once. The shimmer is a CSS transform on the layer, not
       a swapped image: re-decoding a data URI five times a second was the most
       expensive thing on the page and it showed up as stutter during the
       section animations. */
    var S = 128, alpha = opts.alpha || 26;
    var c = document.createElement('canvas'); c.width = c.height = S;
    var cx = c.getContext('2d');
    var d = cx.createImageData(S, S);
    for (var i = 0; i < d.data.length; i += 4) {
      var v = 255 * Math.random();
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = Math.random() * alpha;
    }
    cx.putImageData(d, 0, 0);
    el.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
  };

  /* ------------------------------------------------------- caustic lightfield */
  /* Slow gold light drifting across the ground, the way light moves through
     glass onto silk. Pure Canvas 2D; pauses when off-screen or hidden.        */
  FX.light = function (canvas, opts) {
    if (!canvas) return;
    opts = opts || {};
    var cx = canvas.getContext('2d');
    /* Seven full-bleed gradients a frame is the most expensive thing on the
       page. They are pure soft light, so a 1x raster is indistinguishable, and
       the drift is slow enough that 30fps is too — and it stops entirely once
       the hero is behind you. */
    var dpr = innerWidth < 700 ? 1 : Math.min(devicePixelRatio || 1, 1.25);
    var w = 0, h = 0, running = true, onScreen = true, prev = 0;
    var warm = opts.warm || 'rgba(255,244,214,0.58)';
    var cool = opts.cool || 'rgba(214,180,110,0.30)';
    var fade = opts.fade || 'rgba(247,242,233,0)';
    var fil  = opts.filament || 'rgba(255,240,205,';
    var filA = opts.filamentAlpha == null ? 0.085 : opts.filamentAlpha;
    var blobs = [];
    for (var i = 0; i < 7; i++) blobs.push({ p: i * 1.13, s: 0.00006 + i * 0.000021, r: 0.30 + i * 0.055, a: i * 0.9 });
    function size() {
      w = canvas.width = Math.max(1, canvas.clientWidth * dpr);
      h = canvas.height = Math.max(1, canvas.clientHeight * dpr);
    }
    size();
    addEventListener('resize', size, { passive: true });
    document.addEventListener('visibilitychange', function () { running = !document.hidden; if (running) requestAnimationFrame(frame); });

        // slower and more deliberate: a hand drawing, not a machine plotting
        var dur = Math.min(3.6, 1.0 + it.len / 520);
        it.el.style.transition = 'stroke-dashoffset ' + dur.toFixed(2) + 's cubic-bezier(.22,.7,.25,1) ' +
          (0.35 + i * 0.105).toFixed(2) + 's';
        it.el.style.strokeDashoffset = '0';
      });
      host.classList.add('trace-on');
    };
    if (sec.classList.contains('played')) run();
    else new MutationObserver(function (m, o) {
      if (sec.classList.contains('played')) { run(); o.disconnect(); }
    }).observe(sec, { attributes: true, attributeFilter: ['class'] });
  };

  /* -------------------------------------------------------------- accordion */
  /* details/summary cannot transition its own height, so the open and close are
     driven here: the panel grows from nothing while its text resolves out of a
     blur. Without JavaScript the browser's own open/close still works.        */
  /* A <details> cannot animate its own height, so it is done by hand — but the
     end of that animation is never left to transitionend alone. On a phone that
     event goes missing often enough to matter: a tap followed by a scroll, a
     backgrounded tab, a throttled frame. When it was missed, the row kept an
     inline height of 0 while still reporting itself open, so every later tap
     ran the closing half again and the answer could never be seen. A timer
     always finishes what the transition started, and every tap repairs the
     row before it acts. */
  FX.accordion = function () {
    $$('details.faq').forEach(function (d) {
      var sum = d.querySelector('summary'), body = d.querySelector('div');
      if (!sum || !body) return;
      var busy = false, timer = 0, finish = null;

      function settle(after, ms) {
        var done = false;
        finish = function (ev) {
          if (ev && (ev.target !== body || ev.propertyName !== 'height')) return;
          if (done) return;
          done = true;
          clearTimeout(timer);
          body.removeEventListener('transitionend', finish);
          finish = null;
          busy = false;
          after();
        };
        body.addEventListener('transitionend', finish);
        timer = setTimeout(finish, ms);
      }

      sum.addEventListener('click', function (e) {
        e.preventDefault();
        if (reduce) { d.open = !d.open; return; }
        // a second tap mid-animation lands the first one rather than queueing
        if (busy) { if (finish) finish(); }

        // whatever a missed transition left behind, this row starts clean
        clearTimeout(timer);
        if (!d.open) { d.classList.remove('shutting'); body.style.height = ''; }
        busy = true;

        if (d.open) {
          body.style.height = body.scrollHeight + 'px';
          d.classList.add('shutting');
          requestAnimationFrame(function () { body.style.height = '0px'; });
          settle(function () {
            d.open = false; d.classList.remove('shutting'); body.style.height = '';
          }, 900);
        } else {
          d.open = true;
          var h = body.scrollHeight;
          body.style.height = '0px';
          requestAnimationFrame(function () { body.style.height = h + 'px'; });
          settle(function () { body.style.height = 'auto'; }, 900);
        }
      });
    });
  };

  /* ------------------------------------------------------------ smooth scroll */
  /* The wheel moves a target, and the page eases toward it. Real scroll
     position still changes, so sticky headers, hash links, IntersectionObserver
     and the scrollbar all keep working — this only softens the arrival.
     A touch screen already has inertia of its own and is left alone, as is
     prefers-reduced-motion.                                                   */
  FX.smooth = function () {
    if (reduce || !fine) return;
    var EASE = 0.12, doc = root;   // per 60fps frame, normalised below
    var target = scrollY, current = scrollY, raf = 0, driving = false, last = 0;

    doc.style.scrollBehavior = 'auto';   // ours stands in for the native one
    var limit = function () { return Math.max(0, doc.scrollHeight - innerHeight); };
    var clamp = function (v) { return Math.max(0, Math.min(limit(), v)); };

    function frame(now) {
      var d = target - current;
      if (Math.abs(d) < 0.4) {
        current = target; raf = 0; last = 0; driving = false; scrollTo(0, current); return;
      }
      // eased by elapsed time, so it settles the same on a 30Hz or a 120Hz screen
      var dt = last ? Math.min(64, now - last) : 16.7;
      last = now;
      current += d * (1 - Math.pow(1 - EASE, dt / 16.67));
      driving = true;
      scrollTo(0, current);
      raf = requestAnimationFrame(frame);
    }
    function push(to) {
      target = clamp(to);
      if (!raf) { current = scrollY; last = 0; raf = requestAnimationFrame(frame); }
    }
    FX.scrollTo = push;

    /* A panel with a scroll of its own — a long select, an overflowing box —
       keeps its wheel. Only the page itself is eased. */
    function ownScroll(node, dy) {
      for (var el = node; el && el !== document.body; el = el.parentElement) {
        if (el.scrollHeight - el.clientHeight <= 1) continue;
        var oy = getComputedStyle(el).overflowY;
        if (oy !== 'auto' && oy !== 'scroll') continue;
        if (dy < 0 && el.scrollTop > 0) return true;
        if (dy > 0 && el.scrollTop < el.scrollHeight - el.clientHeight - 1) return true;
      }
      return false;
    }

    addEventListener('wheel', function (e) {
      if (e.ctrlKey || e.defaultPrevented) return;       // pinch zoom stays native
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      if (ownScroll(e.target, e.deltaY)) return;
      e.preventDefault();
      var m = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
      push(target + e.deltaY * m);
    }, { passive: false });

    // the keyboard gets the same easing rather than a jump
    var KEYS = { PageDown: 0.85, PageUp: -0.85, ArrowDown: 0.10, ArrowUp: -0.10, ' ': 0.85 };
    addEventListener('keydown', function (e) {
      var t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Home') { e.preventDefault(); return push(0); }
      if (e.key === 'End')  { e.preventDefault(); return push(limit()); }
      var k = KEYS[e.key === ' ' && e.shiftKey ? 'PageUp' : e.key];
      if (k == null) return;
      e.preventDefault();
      push(target + innerHeight * k);
    });

    // an in-page link glides instead of jumping
    addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey) return;
      var id = a.getAttribute('href');
      if (!id || id === '#') return;
      var to = document.getElementById(id.slice(1));
      if (!to) return;
      e.preventDefault();
      var head = $('.hdr, header[class]');
      var off = head && getComputedStyle(head).position === 'sticky' ? head.offsetHeight : 0;
      push(to.getBoundingClientRect().top + scrollY - off - 8);
      if (history.replaceState) history.replaceState(null, '', id);
      to.setAttribute('tabindex', '-1');
    });

    /* Anything that moves the page by other means — a scrollbar drag, a
       scrollIntoView, a browser restore — takes the easing with it rather
       than fighting it. */
    addEventListener('scroll', function () {
      if (driving) return;
      target = current = scrollY;
    }, { passive: true });
    addEventListener('resize', function () { target = current = scrollY; }, { passive: true });
  };

  /* -------------------------------------------------------------- boot order */
  function boot() {
    FX.smooth();
    $$('[data-split]').forEach(FX.split);
    FX.grain($('[data-grain]'), { alpha: window.GRAIN_ALPHA || 26 });
    FX.light($('[data-light]'), window.LIGHT_OPTS);
    FX.scroll();
    $$('[data-field]').forEach(FX.field);
    $$('[data-trace]').forEach(FX.trace);
    FX.play();
    FX.accordion();
    FX.spotlight($('[data-spot]'));
    FX.headerNames();
    $$('[data-petals]').forEach(function (c) { FX.petals(c, window.PETALS || {}); });
    FX.open();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.FX = FX;
})();
</script>
</body>
</html>
